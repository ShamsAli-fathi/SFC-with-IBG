apiVersion: v1
kind: ServiceAccount
metadata:
  name: ibg-controller
  namespace: ibg-testbed
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ibg-replica-discovery
  namespace: ibg-testbed
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ibg-controller-discovers-replicas
  namespace: ibg-testbed
subjects:
  - kind: ServiceAccount
    name: ibg-controller
    namespace: ibg-testbed
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ibg-replica-discovery
