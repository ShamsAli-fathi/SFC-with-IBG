apiVersion: batch/v1
kind: Job
metadata:
  name: ibg-controller
  namespace: ibg-testbed
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 180
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ibg-controller
        app.kubernetes.io/part-of: ibg-testbed
    spec:
      restartPolicy: Never
      serviceAccountName: ibg-controller
      containers:
        - name: controller
          image: ibg-testbed:kernel-phase3
          imagePullPolicy: Never
          command:
            - python3
            - -m
            - testbed.kubernetes_controller
          env:
            - name: DATAPATH_MODE
              value: kernel
            - name: OUTCOME_LATENCY_MODE
              value: physical-only-v1
            - name: SOLVER_RESOURCE_DIAGNOSTICS
              value: "false"
            - name: RUNTIME_IMAGE
              value: ibg-testbed:kernel-phase3
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: EXPECTED_REPLICAS
              value: "5"
            - name: NUM_STAGES
              value: "3"
            - name: NUM_FLOWS
              value: "3"
            - name: SLOT_ID
              value: "1"
            - name: IBG_SEEDS
              value: "2050,2051,2052"
            - name: FLOW_GENERATOR_URL
              value: http://flow-generator.$(POD_NAMESPACE).svc.cluster.local.:8080
            - name: REPLICA_PROFILES_PATH
              value: /etc/ibg/profiles.json
            - name: MPLCONFIGDIR
              value: /tmp/matplotlib
          volumeMounts:
            - name: profiles
              mountPath: /etc/ibg
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 1Gi
      volumes:
        - name: profiles
          configMap:
            name: replica-profiles
