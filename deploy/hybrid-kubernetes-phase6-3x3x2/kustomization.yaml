apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../hybrid-kubernetes
replicas:
  - name: hybrid-stage-1
    count: 2
  - name: hybrid-stage-2
    count: 2
  - name: hybrid-stage-3
    count: 2
configMapGenerator:
  - name: ibg-hybrid-runtime-profiles
    namespace: ibg-hybrid-testbed
    behavior: replace
    files:
      - runtime-profiles.json
  - name: ibg-hybrid-planning-links
    namespace: ibg-hybrid-testbed
    behavior: replace
    files:
      - controller-inputs.json
generatorOptions:
  disableNameSuffixHash: true
