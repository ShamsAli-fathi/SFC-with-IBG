apiVersion: v1
kind: ServiceAccount
metadata:
  name: milp-controller
  namespace: milp-testbed
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: milp-replica-discovery
  namespace: milp-testbed
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: milp-controller-discovers-replicas
  namespace: milp-testbed
subjects:
  - kind: ServiceAccount
    name: milp-controller
    namespace: milp-testbed
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: milp-replica-discovery
