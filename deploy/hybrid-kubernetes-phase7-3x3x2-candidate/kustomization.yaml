apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../hybrid-kubernetes-phase7-3x3x2
patches:
  - target:
      group: apps
      version: v1
      kind: StatefulSet
      labelSelector: app.kubernetes.io/name=ibg-hybrid-replica
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 64Mi
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 256Mi
