apiVersion: batch/v1
kind: Job
metadata:
  name: ibg-hybrid-controller-phase75
  namespace: ibg-hybrid-testbed
  labels:
    app.kubernetes.io/name: ibg-hybrid-controller
    app.kubernetes.io/part-of: ibg-hybrid-testbed
    ibg-hybrid.phase: infrastructure-phase75
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ibg-hybrid-controller
        app.kubernetes.io/part-of: ibg-hybrid-testbed
        ibg-hybrid.phase: infrastructure-phase75
    spec:
      restartPolicy: Never
      serviceAccountName: ibg-hybrid-controller
      nodeSelector:
        ibg-hybrid.workload-node: "true"
      containers:
        - name: controller
          image: ibg-hybrid-testbed:kernel-controller-v1
          imagePullPolicy: Never
          command: ["python3", "-m", "IBG_Hybrid.kernel_controller_cli"]
          env:
            - name: HYBRID_CONTROLLER_INPUTS_PATH
              value: /etc/ibg-hybrid-controller/controller-inputs.json
            - name: FLOW_GENERATOR_URL
              value: http://ibg-hybrid-flow-generator.ibg-hybrid-testbed.svc.cluster.local.:8080
            - name: HYBRID_POSTERIOR_MIRROR_URL
              value: http://ibg-hybrid-posterior-mirror.ibg-hybrid-testbed.svc.cluster.local.:8080
            - name: HYBRID_CONTROLLER_POD_UID
              valueFrom: {fieldRef: {fieldPath: metadata.uid}}
            - name: SLOT_ID
              value: "1"
            - name: MAX_ITERATIONS
              value: "2"
          volumeMounts:
            - name: controller-inputs
              mountPath: /etc/ibg-hybrid-controller
              readOnly: true
            - name: controller-phase75-source
              mountPath: /app/IBG_Hybrid/control_plane_footprint.py
              subPath: control_plane_footprint.py
              readOnly: true
            - name: controller-phase75-source
              mountPath: /app/IBG_Hybrid/kernel_controller.py
              subPath: kernel_controller.py
              readOnly: true
            - name: controller-phase75-source
              mountPath: /app/IBG_Hybrid/kernel_kubernetes_discovery.py
              subPath: kernel_kubernetes_discovery.py
              readOnly: true
            - name: controller-phase75-source
              mountPath: /app/IBG_Hybrid/kernel_phase4_validation.py
              subPath: kernel_phase4_validation.py
              readOnly: true
            - name: controller-phase75-source
              mountPath: /app/IBG_Hybrid/kernel_controller_cli.py
              subPath: kernel_controller_cli.py
              readOnly: true
            - name: controller-phase75-source
              mountPath: /app/IBG_Hybrid/console_output.py
              subPath: console_output.py
              readOnly: true
            - name: controller-phase75-source
              mountPath: /app/IBG_Hybrid/posterior_mirror.py
              subPath: posterior_mirror.py
              readOnly: true
          resources:
            requests: {cpu: "2", memory: 256Mi}
            limits: {cpu: "4", memory: 1Gi}
      volumes:
        - name: controller-inputs
          configMap:
            name: ibg-hybrid-planning-links
        - name: controller-phase75-source
          configMap:
            name: ibg-hybrid-controller-phase75-source
