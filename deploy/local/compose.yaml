x-testbed-service: &testbed-service
  build:
    context: ../..
    dockerfile: deploy/local/Dockerfile
  image: ibg-testbed:phase4
  restart: "no"

x-healthcheck: &healthcheck
  test:
    - CMD
    - python3
    - -c
    - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"
  interval: 2s
  timeout: 2s
  retries: 30

services:
  stage-1-0:
    <<: *testbed-service
    environment:
      STAGE: "1"
      REPLICA_ID: "1"
      POD_NAME: stage-1-0
      STATE: "4"
      CAPACITY: "2000"
      BASE_DELAY_MS: "40"
      CONGESTION_DELAY_MS: "10"
    healthcheck: *healthcheck

  stage-2-0:
    <<: *testbed-service
    environment:
      STAGE: "2"
      REPLICA_ID: "1"
      POD_NAME: stage-2-0
      STATE: "3"
      CAPACITY: "5000"
      BASE_DELAY_MS: "40"
      CONGESTION_DELAY_MS: "10"
    healthcheck: *healthcheck

  stage-3-0:
    <<: *testbed-service
    environment:
      STAGE: "3"
      REPLICA_ID: "1"
      POD_NAME: stage-3-0
      STATE: "2"
      CAPACITY: "5000"
      BASE_DELAY_MS: "40"
      CONGESTION_DELAY_MS: "10"
    healthcheck: *healthcheck

  flow-generator:
    <<: *testbed-service
    command:
      - python3
      - -m
      - uvicorn
      - testbed.flow_generator:app
      - --host
      - 0.0.0.0
      - --port
      - "8080"
    ports:
      - "18081:8080"
    depends_on:
      stage-1-0:
        condition: service_healthy
      stage-2-0:
        condition: service_healthy
      stage-3-0:
        condition: service_healthy
    healthcheck: *healthcheck
