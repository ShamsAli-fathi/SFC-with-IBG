apiVersion: v1
kind: Service
metadata:
  name: ibg-hybrid-posterior-mirror
  namespace: ibg-hybrid-testbed
  labels:
    app.kubernetes.io/name: ibg-hybrid-posterior-mirror
    app.kubernetes.io/part-of: ibg-hybrid-testbed
    app.kubernetes.io/component: measurement
spec:
  selector:
    app.kubernetes.io/name: ibg-hybrid-posterior-mirror
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ibg-hybrid-posterior-mirror
  namespace: ibg-hybrid-testbed
  labels:
    app.kubernetes.io/name: ibg-hybrid-posterior-mirror
    app.kubernetes.io/part-of: ibg-hybrid-testbed
    app.kubernetes.io/component: measurement
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ibg-hybrid-posterior-mirror
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ibg-hybrid-posterior-mirror
        app.kubernetes.io/part-of: ibg-hybrid-testbed
        app.kubernetes.io/component: measurement
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        ibg-hybrid.workload-node: "true"
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: posterior-mirror
          image: ibg-hybrid-testbed:kernel-service-v1
          imagePullPolicy: Never
          command: ["python3", "-m", "uvicorn", "IBG_Hybrid.posterior_mirror:app", "--host", "0.0.0.0", "--port", "8080"]
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 10
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: controller-source
              mountPath: /app/IBG_Hybrid/posterior_mirror.py
              subPath: posterior_mirror.py
              readOnly: true
          resources:
            requests: {cpu: 25m, memory: 64Mi}
            limits: {cpu: 250m, memory: 128Mi}
      volumes:
        - name: controller-source
          configMap:
            name: ibg-hybrid-controller-phase75-source
